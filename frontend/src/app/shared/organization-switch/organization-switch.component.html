<div class="org-switch">
  <span class="org-switch__label">Organizzazione</span>
  <button
    type="button"
    class="org-switch__trigger"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    (click)="toggle($event)"
  >
    <span>{{ currentLabel }}</span>
    <mat-icon>{{ open ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>

  @if (open) {
    <ul class="org-switch__menu" role="listbox">
      @for (option of options; track option.slug) {
        <li>
          <button
            type="button"
            role="option"
            [attr.aria-selected]="option.label === currentLabel"
            [class.org-switch__option--selected]="option.label === currentLabel"
            (click)="choose(option.slug)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
</div>
