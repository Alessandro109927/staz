<div
  class="event-result-row"
  [class.event-result-row--slip-pick]="layout === 'slip-pick'"
  [class.event-result-row--saving]="saving"
>
  @if (showEventName) {
    <span class="event-result-row__name">{{ event.eventName }}</span>
  }

  @if (layout === 'default' || layout === 'slip-pick') {
    <app-event-result-toggle
      [resultStatus]="event.resultStatus ?? null"
      [disabled]="saving"
      (resultToggle)="toggleResult($event)"
    />
  }

  @if (layout === 'slip-pick') {
    <span class="event-result-row__pick">
      @if (event.outcome) {
        <span class="event-result-row__outcome">{{ event.outcome }}</span>
      }
      @if (event.odds) {
        <span class="event-result-row__odds-inline"> ({{ event.odds }})</span>
      }
    </span>
  } @else {
    @if (event.outcome) {
      <span class="event-result-row__outcome">{{ event.outcome }}</span>
    }

    <span class="event-result-row__odds">{{ event.odds }}</span>
  }
</div>
