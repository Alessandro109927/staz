<h2 mat-dialog-title>{{ rule ? 'Modifica regola' : 'Nuova regola' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="staking-rule-form">
    <label class="vs-field">
      <span class="vs-field__label">Quota min</span>
      <input class="vs-input" type="number" step="0.01" min="1" formControlName="minOdds" />
    </label>

    <label class="vs-field">
      <span class="vs-field__label">Quota max</span>
      <input
        class="vs-input"
        type="number"
        step="0.01"
        min="1"
        formControlName="maxOdds"
        placeholder="Vuoto = oltre il minimo"
      />
    </label>

    <label class="vs-field">
      <span class="vs-field__label">Stake %</span>
      <div class="vs-input-affix">
        <input class="vs-input" type="number" step="0.01" min="0.01" formControlName="stakePercentage" />
        <span class="vs-input-affix__suffix">%</span>
      </div>
    </label>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Annulla</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">
    {{ rule ? 'Salva modifiche' : 'Aggiungi regola' }}
  </button>
</mat-dialog-actions>
