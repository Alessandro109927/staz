<mat-card class="setup-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>account_balance_wallet</mat-icon>
    <mat-card-title>Setup iniziale</mat-card-title>
    <mat-card-subtitle>
      Imposta il capitale con cui iniziare a gestire le scommesse
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (loading) {
      <p>Caricamento...</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Capitale iniziale (€)</mat-label>
          <input matInput type="number" step="0.01" formControlName="initialCapital" />
        </mat-form-field>

        @if (hasExistingCapital) {
          <p class="hint">
            Esiste già un capitale configurato. Per reimpostarlo con scommesse attive,
            attiva il reset esplicito.
          </p>
          <label class="reset-toggle">
            <input type="checkbox" formControlName="reset" />
            Reset esplicito del capitale
          </label>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
          <mat-icon>save</mat-icon>
          Salva capitale
        </button>
      </form>
    }
  </mat-card-content>
</mat-card>
