<div class="setup-page">
  <div class="setup-card vs-card">
    <div class="setup-card__brand">
      <div class="setup-card__icon">
        <mat-icon>account_balance_wallet</mat-icon>
      </div>
      <h1>Setup iniziale</h1>
      <p>Imposta il capitale con cui iniziare a gestire le scommesse.</p>
    </div>

    @if (loading) {
      <p class="setup-loading">Caricamento...</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="setup-form">
        <label class="vs-field">
          <span class="vs-field__label">Capitale iniziale</span>
          <div class="vs-input-affix">
            <span class="vs-input-affix__prefix">€</span>
            <input
              class="vs-input"
              type="number"
              step="0.01"
              min="0.01"
              formControlName="initialCapital"
            />
          </div>
        </label>

        @if (hasExistingCapital) {
          <p class="setup-hint">
            Esiste già un capitale configurato. Per reimpostarlo con scommesse attive,
            attiva il reset esplicito.
          </p>
          <label class="setup-reset">
            <input type="checkbox" formControlName="reset" />
            Reset esplicito del capitale
          </label>
        }

        <button
          type="submit"
          class="vs-btn-primary vs-btn-primary--block"
          [disabled]="form.invalid"
        >
          <mat-icon>save</mat-icon>
          Salva capitale
        </button>
      </form>
    }
  </div>
</div>
